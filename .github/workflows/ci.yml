name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The dependency-free claim is one of this project's selling points, so it is
  # checked on its own, in a job that installs nothing at all, apart from the
  # runtime itself. If this job ever needs a `pip install`, the claim is false.
  zero-install:
    name: Zero-install (stdlib only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parsing layer unit tests
        run: python -m unittest discover -s tests -p "test_parsing.py" -v
      - name: Pre-flight (config, sources, parsing)
        run: python scripts/preflight.py --skip-net

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The lock is universal (Python 3.10+ / Linux / macOS / Windows) and
      # hash-carrying, so both matrix entries install the same verified bytes.
      - name: Install (locked, hash-verified)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install -e . --no-deps
      # The offline suite. The live end-to-end test is marked `slow` and needs a
      # Zhipu credential, so it is excluded here on purpose rather than skipped
      # silently - `-m "not slow"` fails loudly if a new test forgets its marker.
      - name: Offline test suite
        run: pytest tests/ -m "not slow" -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # A gate, not a report. `ruff check` and `ruff format --check` both pass on
    # this tree; `make lint` runs the same two commands locally.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # `compileall` needs no install and catches the one class of error that
      # otherwise only shows up at import time in production.
      - name: Syntax check (stdlib, always enforced)
        run: python -m compileall -q src scripts app tests
      - run: pip install ruff
      - run: ruff check .
      - name: Formatting is part of the style contract
        run: ruff format --check .
      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock --progress-spinner off

  demo:
    name: Render the sample report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
      # No API key, no network, no virtualenv gymnastics: exactly what the
      # README tells a visitor to run. If this breaks, the first command in the
      # README is broken.
      - name: sourced-intel demo
        run: sourced-intel demo --out examples/demo-report.html
      - name: The report must really be HTML
        run: |
          test -s examples/demo-report.html
          grep -q '<section id="evidence"' examples/demo-report.html
          ! grep -q '{{' examples/demo-report.html
      - uses: actions/upload-artifact@v4
        with:
          name: demo-report
          path: examples/demo-report.html
          if-no-files-found: error
